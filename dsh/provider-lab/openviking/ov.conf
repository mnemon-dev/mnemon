{
  "server": {
    "auth_mode": "trusted",
    "root_api_key": "dsh-provider-lab-local-only"
  },
  "storage": {
    "workspace": "/app/.openviking/data",
    "vectordb": {
      "name": "context",
      "backend": "local"
    },
    "agfs": {
      "backend": "local"
    }
  },
  "embedding": {
    "dense": {
      "provider": "ollama",
      "api_base": "http://host.docker.internal:11434/v1",
      "api_key": "ollama",
      "model": "nomic-embed-text",
      "dimension": 768,
      "input": "text"
    }
  },
  "vlm": {
    "provider": "litellm",
    "api_base": "http://host.docker.internal:11434",
    "api_key": "ollama",
    "model": "ollama/qwen2.5:0.5b",
    "max_concurrent": 1,
    "extra_request_body": {
      "think": false
    }
  }
}
