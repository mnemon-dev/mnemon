<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" lang="en" role="img" aria-labelledby="title description">
  <title id="title">Source + Strategy → View</title>
  <desc id="description">Sources own memory. A Strategy proposes composition from Source facts. Core validates the proposal and calls Source projection to produce an immutable View. The DSH Host pins it to one executing turn and routes reads and authorized actions to the owning Source.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#667085" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="280" rx="16" fill="#f8fafc"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="32" y="38" font-size="15" fill="#667085">COMPOSABLE MEMORY · ONE VIEW PER EXECUTING TURN</text>
    <g stroke="#d0d5dd" fill="#fff">
      <rect x="32" y="78" width="226" height="114" rx="12"/>
      <rect x="312" y="78" width="184" height="114" rx="12"/>
      <rect x="550" y="78" width="200" height="114" rx="12"/>
      <rect x="804" y="78" width="150" height="114" rx="12" fill="#eff6ff" stroke="#93b4eb"/>
      <rect x="1008" y="78" width="160" height="114" rx="12"/>
    </g>
    <g fill="#182230" font-size="22" font-weight="600">
      <text x="52" y="112">Sources</text><text x="332" y="112">Strategy</text><text x="570" y="112">Core</text><text x="824" y="112">View</text><text x="1028" y="112">DSH Host</text>
    </g>
    <g fill="#475467" font-size="15">
      <text x="52" y="143">Runtime · Documents</text><text x="52" y="167">Memory Spaces · Custom</text>
      <text x="332" y="143">Select · budget</text><text x="332" y="167">Compose · guide</text>
      <text x="570" y="143">Validate proposal</text><text x="570" y="167">Call Source projection</text>
      <text x="824" y="143">Context</text><text x="824" y="167">Routes · actions</text>
      <text x="1028" y="143">Pin to turn</text><text x="1028" y="167">Present to LLM</text>
    </g>
    <g stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M266 136H300"/><path d="M504 136H538"/><path d="M758 136H792"/><path d="M962 136H996"/>
    </g>
    <g fill="#667085" font-size="12" text-anchor="middle">
      <text x="285" y="120">facts</text><text x="523" y="120">spec</text>
    </g>
    <text x="32" y="234" fill="#475467" font-size="15">Reads and authorized actions return to their Source. A new turn can observe a new revision.</text>
    <text x="32" y="257" fill="#667085" font-size="14">Provider children belong to Memory Spaces, not to Core.</text>
  </g>
</svg>
