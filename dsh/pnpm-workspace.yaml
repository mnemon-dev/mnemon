packages:
  - .
  - plugins/*

# Author packages use normal semver peers; the workspace links those peers only
# for local development. Packed/extracted packages have no workspace dependency.
linkWorkspacePackages: true
preferWorkspacePackages: true

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  koffi: true
  lightningcss: true
  node-pty: true
  protobufjs: true

