# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: mnemon
    main: .
    binary: mnemon
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mnemon-dev/mnemon/cmd.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - mnemon
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - src: internal/records/LICENSE.v8
        dst: .
        strip_parent: true
      - src: internal/memoryagent/LICENSE.memory-agent
        dst: .
        strip_parent: true

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^Merge"
      - "(?i)eval"
      - "(?i)codex app-server"
      - "(?i)skill loop"
      - "(?i)memory loop"
      - "(?i)modular"
      - "(?i)self-evolution"
      - "(?i)agent memory"

homebrew_casks:
  - name: mnemon
    ids:
      - default
    binaries:
      - mnemon
    repository:
      owner: mnemon-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/mnemon-dev/mnemon"
    description: "Persistent memory and durable agency for LLM agents"
    # The binary is ad hoc/linker-signed only (not notarized), so the cask
    # download carries com.apple.quarantine and Gatekeeper kills the first
    # launch. Strip the attribute from the staged binary so the user needs no
    # manual step.
    #
    # `hooks.post.install` renders a `postflight do ... end` block, which
    # Homebrew deprecates in favor of the declarative `postflight_steps` DSL
    # (goreleaser/goreleaser#6870). Until GoReleaser ships a steps-aware hook
    # (goreleaser/goreleaser#6873), emit the stanza through `custom_block`.
    # The `{{ "{{staged_path}}" }}` quoting escapes GoReleaser's own template
    # pass so Homebrew's `{{staged_path}}` install-steps token survives into
    # the generated cask.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/mnemon"]
        end
      end

release:
  github:
    owner: mnemon-dev
    name: mnemon
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    v{{.Version}} ships Mnemon Memory and the local Agency authority in one `mnemon` binary.
